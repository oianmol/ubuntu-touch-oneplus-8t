# OnePlus 8T (kebab). Format as in the UBports nothing-spacewar port. Cutout/panel numbers come from the
# LineageOS device tree (android_device_oneplus_kebab overlay): punch-hole camera = 68 px circle, centre
# 99 px from the left edge and 68.5 px from the top; status bar 123 px; cutout bounding rect (0,0)-(164,123).
# Rectangles are "x y w h" in panel pixels.
KEBAB:
  Names:
    - kebab
    - OnePlus8T
    - KB2005
    - KB2001
    - KB2003
    - KB2000

  PrettyName: OnePlus 8T
  DeviceType: phone
  GridUnit: 21
  PrimaryOrientation: Portrait
  SupportedOrientations:
    - Portrait
    - InvertedPortrait
    - Landscape
    - InvertedLandscape

  # Torch: the dual-LED flash is exposed as led:torch_*/led:switch_*; Lomiri toggles the first pair
  # (the files are made writable for the session user in usr/libexec/lxc-android-config/device-hacks).
  FlashlightSysfsPath:
    - /sys/class/leds/led:torch_0/brightness
  FlashlightSwitchPath:
    - /sys/class/leds/led:switch_0/brightness

  # Telephony: the Android 13 radio HAL speaks HIDL over binder, so ofono must use its binder plugin, not the legacy RIL
  # socket plugin (/usr/libexec/lxc-android-config/ofonod-wrapper picks it from this key).
  OfonoPlugin: binder

  CollapsedPanelHeight: 123
  DisplayCutoutsCollapsed:
  - 0 0 164 123
  - 1055 0 25 123
  DisplayCutoutsCollapsedLight:
  - 0 0 164 123
  - 1055 0 25 123
