# OnePlus 8T (kebab). Format as in the UBports nothing-spacewar port. Cutout/panel numbers come from the
# LineageOS device tree (android_device_oneplus_kebab overlay): punch-hole camera = 68 px circle, centre
# 99 px from the left edge and 68.5 px from the top; status bar 123 px; cutout bounding rect (0,0)-(164,123).
# Rectangles are "x y w h" in panel pixels.
KEBAB:
  Names:
    - kebab
    - OnePlus8T
    - KB2005
    - KB2001
    - KB2003
    - KB2000

  PrettyName: OnePlus 8T
  DeviceType: phone
  GridUnit: 21
  PrimaryOrientation: Portrait
  SupportedOrientations:
    - Portrait
    - InvertedPortrait
    - Landscape
    - InvertedLandscape

  CollapsedPanelHeight: 123
  DisplayCutoutsCollapsed:
  - 0 0 164 123
  - 1055 0 25 123
  DisplayCutoutsCollapsedLight:
  - 0 0 164 123
  - 1055 0 25 123
