# OnePlus 8T (kebab) bring-up. Overlay of the UT default (all commented out).
# Keep usb-moded's rescue mode ON (no USB_MODED_ARGS override): until the display manager runs, usb-moded gives
#   ssh -p 8022 phablet@10.15.19.82      (empty password allowed, USB link only)
#
# The kernel exposes the stub /sys/class/android_usb/android0, which makes the configurator assume
# android_usb mode (rndis.usb0 / rndis0), but the real gadget is configfs. macOS has no RNDIS driver, so
# pin the "RNDIS" modes to NCM (built into this kernel). Same override as the OnePlus 11 port.
RNDIS_FUNCTION=ncm.usb0
RNDIS_IFNAME=usb0
