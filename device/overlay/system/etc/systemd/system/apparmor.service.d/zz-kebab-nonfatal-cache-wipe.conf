# Named zz- so it sorts AFTER lxc-android-config.conf (drop-ins merge by filename); otherwise that file re-adds the fatal step.
# lxc-android-config's wipe-aa-cache-on-channel-switch.py returns 1 when the rootfs is not system-image based
# (no /etc/system-image/config.d), which is always the case for a rootfs tarball install. As an ExecStartPre
# that aborts apparmor.service, so no profiles load and media-hub-server crashes on every client
# ("apparmor::Context cannot be created for empty name"). Keep the step but ignore its exit status.
[Service]
ExecStartPre=
ExecStartPre=-/usr/libexec/lxc-android-config/wipe-aa-cache-on-channel-switch.py
