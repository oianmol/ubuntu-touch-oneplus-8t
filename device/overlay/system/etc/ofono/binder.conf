# ofono binder plugin configuration for the OnePlus 8T (kebab). Without it ofono logs "Missing path for slot slot1/slot2"
# and never creates a modem. Format follows the UBports google-sargo port (another Qualcomm device).
#
# The vendor HAL (Android 13) serves android.hardware.radio@1.5::IRadio/slot1 and /slot2, android.hardware.radio.config@1.1
# and the Qualcomm vendor.qti.hardware.radio.qtiradio@2.4 extension (see vendor/etc/vintf/manifest.xml). The phone is
# configured dual SIM (persist.radio.multisim.config=dsds), so qcrild2 and slot2 exist as well.
[Settings]
ExpectSlots = slot1,slot2
radioInterface = 1.5

[slot1]
path = /ril_0
slot = 0
extPlugin = qti

[slot2]
path = /ril_1
slot = 1
extPlugin = qti
